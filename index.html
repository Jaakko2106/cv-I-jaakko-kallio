<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaakko | Ansioluettelo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: {
                            DEFAULT: 'var(--accent-primary)',
                            hover: 'var(--accent-hover)',
                            shadow: 'var(--accent-shadow)',
                        },
                        base: {
                            DEFAULT: 'var(--bg-base)',
                            text: 'var(--text-base)',
                            surface: 'var(--bg-surface)',
                            border: 'var(--border-base)',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Indigo */
            --accent-indigo-primary: #4f46e5;
            --accent-indigo-hover: #4338ca;
            --accent-indigo-shadow: rgba(79, 70, 229, 0.2);

            /* Emerald */
            --accent-emerald-primary: #10b981;
            --accent-emerald-hover: #059669;
            --accent-emerald-shadow: rgba(16, 185, 129, 0.2);

            /* Rose */
            --accent-rose-primary: #f43f5e;
            --accent-rose-hover: #e11d48;
            --accent-rose-shadow: rgba(244, 63, 94, 0.2);

            /* Amber */
            --accent-amber-primary: #f59e0b;
            --accent-amber-hover: #d97706;
            --accent-amber-shadow: rgba(245, 158, 11, 0.2);

            /* Cyan */
            --accent-cyan-primary: #06b6d4;
            --accent-cyan-hover: #0891b2;
            --accent-cyan-shadow: rgba(6, 182, 212, 0.2);

            /* Active Accent (Defaults to Indigo) */
            --accent-primary: var(--accent-indigo-primary);
            --accent-hover: var(--accent-indigo-hover);
            --accent-shadow: var(--accent-indigo-shadow);

            --bg-base: #1e1b4b; /* indigo-950 */
            --text-base: #f3f4f6; /* gray-100 */
            --bg-surface: rgba(255, 255, 255, 0.05);
            --border-base: rgba(255, 255, 255, 0.1);

            /* Animation Variables */
            --anim-duration: 0.6s;
            --anim-easing: cubic-bezier(0.645, 0.045, 0.355, 1);
            --anim-distance: 30px;
        }

        [data-theme='light'] {
            --bg-base: #f9fafb; /* gray-50 */
            --text-base: #111827; /* gray-900 */
            --bg-surface: rgba(0, 0, 0, 0.05);
            --border-base: rgba(0, 0, 0, 0.1);
        }

        .dark-theme-only { display: block; }
        .light-theme-only { display: none; }

        [data-theme='light'] .dark-theme-only { display: none; }
        [data-theme='light'] .light-theme-only { display: block; }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; /* Prevent horizontal scroll due to off-canvas */
            background-color: var(--bg-base);
            color: var(--text-base);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        /* Custom styles for the off-canvas menu transition */
        .off-canvas-menu {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            background-color: var(--bg-base);
            backdrop-filter: blur(12px);
        }
        .off-canvas-menu.open {
            transform: translateX(0);
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .overlay.open {
            visibility: visible;
            opacity: 1;
        }
        /* Smooth scroll for anchor links */
        html {
            scroll-behavior: smooth;
        }

        /* Prevent fixed header overlap */
        section {
            scroll-margin-top: 5rem;
        }

        /* Apply animations to elements that will be observed */
        .animate-on-scroll {
            opacity: 0;
            transition: opacity var(--anim-duration) var(--anim-easing), transform var(--anim-duration) var(--anim-easing);
        }
        .fade-in {
            /* Just opacity, no transform */
        }
        .fade-in-up {
            transform: translateY(var(--anim-distance));
        }
        .fade-in-down {
            transform: translateY(calc(-1 * var(--anim-distance)));
        }
        .fade-in-left {
            transform: translateX(calc(-1 * var(--anim-distance)));
        }
        .fade-in-right {
            transform: translateX(var(--anim-distance));
        }
        .zoom-in {
             transform: scale(0.9);
        }
        .animate-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0) translateX(0) scale(1);
        }

        /* Modal styles */
        .modal {
            position: fixed; /* Stay in place */
            z-index: 100; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            background-color: rgba(0,0,0,0.8); /* Darker backdrop */
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
        }
        .modal.open {
             opacity: 1;
             visibility: visible;
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            position: relative;
            transform: scale(0.95);
            opacity: 0;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }
        .modal.open .modal-content {
            transform: scale(1);
            opacity: 1;
        }
        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }
        .close-button:hover,
        .close-button:focus {
            color: #000;
        }
       
        .carousel-slide {
            display: none;
            transition: opacity 0.5s ease-in-out;
        }
        .carousel-slide.active {
            display: block;
        }
        
        /* Animated Background Removed - replaced by Video */
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-indigo-950 text-gray-100">
    <div id="root"></div>

    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",

        "react/": "https://aistudiocdn.com/react@^19.2.0/"
      }
    }
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
