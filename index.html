<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaakko | Ansioluettelo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; /* Prevent horizontal scroll due to off-canvas */
            background-color: #1e1b4b; /* indigo-950 - match video overlay base */
        }
        /* Custom styles for the off-canvas menu transition */
        .off-canvas-menu {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            background-color: rgba(30, 27, 75, 0.9); /* Dark indigo */
            backdrop-filter: blur(12px);
        }
        .off-canvas-menu.open {
            transform: translateX(0);
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .overlay.open {
            visibility: visible;
            opacity: 1;
        }
        /* Smooth scroll for anchor links */
        html {
            scroll-behavior: smooth;
        }

        /* Prevent fixed header overlap */
        section {
            scroll-margin-top: 5rem;
        }

        /* Apply animations to elements that will be observed */
        .animate-on-scroll {
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        .fade-in-up {
            transform: translateY(30px);
        }
        .fade-in-left {
            transform: translateX(-30px);
        }
        .fade-in-right {
            transform: translateX(30px);
        }
        .zoom-in {
             transform: scale(0.9);
        }
        .animate-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0) translateX(0) scale(1);
        }

        /* Modal styles */
        .modal {
            position: fixed; /* Stay in place */
            z-index: 100; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            background-color: rgba(0,0,0,0.8); /* Darker backdrop */
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
        }
        .modal.open {
             opacity: 1;
             visibility: visible;
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            position: relative;
            transform: scale(0.95);
            opacity: 0;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }
        .modal.open .modal-content {
            transform: scale(1);
            opacity: 1;
        }
        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }
        .close-button:hover,
        .close-button:focus {
            color: #000;
        }
       
        .carousel-slide {
            display: none;
            transition: opacity 0.5s ease-in-out;
        }
        .carousel-slide.active {
            display: block;
        }
        
        /* Animated Background Removed - replaced by Video */
    </style>
</head>
<body class="bg-indigo-950 text-gray-100">
    <div id="root"></div>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/"
      }
    }
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
